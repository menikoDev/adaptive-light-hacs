# Descriptions of the services and fields live in strings.json / translations (generated by tools/gen_strings.py).
# calibrate: refuses only without an illuminance sensor or when already running. Daylight, mode, presence and TV are
# warnings (log, notification, sensor attribute `warnings`, service response), never a block. Do not touch the lamps meanwhile.
# A lamp without growth is not measured: it keeps its base k (calibration_source / base_lamps attributes). calibrate_apply writes
# base values explicitly and never writes dark_lux_offset from a run without any growth.
